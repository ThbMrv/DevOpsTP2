name: Build and test Application

on:
  #Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_test:
    #The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
      API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devopstp2-api:1.0
      MONGO_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devopstp2-mongo:1.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for python
        run: docker build --pull -t "$API_IMAGE" -f api/Dockerfile .
      - name: Build image for Mongo
        run: docker build --pull -t "$MONGO_IMAGE" -f mongo/Dockerfile .
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          image: ${{ env.API_IMAGE }}
          file: api/Dockerfile
          only-severities: critical, high
          exit-code: false
      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          image: ${{ env.MONGO_IMAGE }}
          file: mongo/Dockerfile
          only-severities: critical, high
          exit-code: false
      - name: Push Python image to Docker Hub
        if: github.event_name == 'push'
        run: docker push "$API_IMAGE"

      - name: Push Mongo image to Docker Hub
        if: github.event_name == 'push'
        run: docker push "$MONGO_IMAGE"

  docker-compose:
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the stack
        run: docker compose up -d
        env:
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          MONGO_COLLECTION: ${{ secrets.MONGO_COLLECTION }}
          MONGO_APP_USER: ${{ secrets.MONGO_APP_USER }}
          MONGO_APP_PASSWORD: ${{ secrets.MONGO_APP_PASSWORD }}
          MONGO_PORT: ${{ secrets.MONGO_PORT }}

          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
