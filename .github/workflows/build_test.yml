name: Build and test Application

on:
  #Triggers the workflow on push or pull request events but only for the main branch actions hub new docker secret
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_test:
    #The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for python
        run: docker build -t devopstp2-api:1.0 -f api/Dockerfile .
      - name: Build image for Mongo
        run: docker build -t devopstp2-mongo:1.0 -f mongo/Dockerfile .
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          image: devopstp2-api:1.0
          file: api/Dockerfile
          only-severities: critical, high
          exit-code: true
      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves, recommendations
          image: devopstp2-mongo:1.0
          file: mongo/Dockerfile
          only-severities: critical, high
          exit-code: true
